# Release workflow for a PUBLIC fylr plugin: a manager publishes a release on
# the GitHub release page (tag vX.Y.Z), this builds the plugin zip and attaches
# it — the asset URL (releases/latest/download/...) is what fylr installs from.
#
# This is the canonical public-plugin workflow; the private-plugin variant
# (GitHub Pages delivery under an unguessable URL) and the seal toggle live in
# fylr-build-plugin/templates/.
name: Release

on:
  release:
    types:
      - published
      - edited

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install CoffeeScript and sass
        run: sudo npm install -g coffeescript@1.12.7 sass

      - name: Install golang
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Build and package
        run: make zip
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ZIP_NAME: ${{ github.event.repository.name }}.zip

      - name: Attach plugin zip to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/${{ github.event.repository.name }}.zip
